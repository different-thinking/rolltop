android.useAndroidX=true
kotlin.code.style=official

# The daemon's 512 MiB metaspace default is not enough to package the release
# variant: CI runners exhaust it partway through :app:packageRelease, which
# surfaces as a build that dies without naming a cause. Give it explicit room.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
