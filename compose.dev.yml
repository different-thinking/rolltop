# The PostgreSQL the test suite runs against.
#
#   docker compose -f compose.dev.yml up -d db
#   export TEST_DATABASE_URL='postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable'
#   go test ./...
#
# The role is a superuser on purpose: the suite creates and drops a database per
# test, and clones them from a template it marks as one. That is why this must
# be a throwaway local server and not the hosted database, whose role has no
# CREATEDB at all — pgtestdb says so rather than failing with a bare permission
# error.
#
# tmpfs storage: nothing here survives a restart, and nothing should. It also
# takes the disk out of the suite's runtime, which is most of what a few hundred
# CREATE DATABASE calls cost.

services:
  db:
    # 16 to match the hosted production server. The baseline pins COLLATE "C"
    # on every text column, so the cluster's own locale deliberately does *not*
    # matter — leaving the image's non-C default in place is the more faithful
    # test of that, because it is what the hosted database has.
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - postgres
      # A test binary runs its packages in parallel and each store opens a small
      # pool, so the default 100 is the first thing a full run hits.
      - -c
      - max_connections=300
      # Durability buys nothing for a database that is thrown away.
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
