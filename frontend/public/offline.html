<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f0eb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10161f" />
    <title>rolltop</title>
    <style>
      /* Offline is served without a session, so the reader's stored theme is
         unknown here and the operating system decides. Values mirror --chrome,
         --bg, --text and --surface in frontend/src/styles/mixins/. */
      :root {
        color-scheme: light;
        --bg: #f2f0eb;
        --surface: #fff;
        --text: #202426;
        --border: #b7b3aa;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #10161f;
          --surface: #1a2230;
          --text: #e2dfd9;
          --border: #6a7789;
        }
      }

      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px system-ui, sans-serif; }
      main { text-align: center; }
      button { min-height: 42px; margin-top: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 8px 16px; background: var(--surface); color: inherit; font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <strong>Rolltop is offline</strong><br />
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
