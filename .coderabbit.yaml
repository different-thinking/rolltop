# CodeRabbit configuration. This file takes precedence over the settings in
# the CodeRabbit organization UI; unset options fall back to CodeRabbit's
# defaults, not to the UI values.
reviews:
  # Without this, CodeRabbit still posts a "review skipped" status comment on
  # every pull request even though reviews are off.
  review_status: false
  auto_review:
    # Automatic reviews are off: CodeRabbit does not comment when a pull
    # request is opened or updated. A review can still be requested on demand
    # by commenting "@coderabbitai review" on the pull request.
    enabled: false
    auto_incremental_review: false
