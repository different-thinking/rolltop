name: CI

# Three-stage pipeline for `main` and tags: verify, deploy, release.
#
# `verify` covers what a merge commit carries that no pull request check ran.
# That set is smaller than it looks: GitHub builds a pull request's checks from
# `refs/pull/N/merge`, the branch already merged into `main`, so `pr.yml` runs
# the same `go test` over the same tree the merge produces. Re-running the whole
# suite here bought a second copy of a result that already existed.
#
# What `pr.yml` genuinely does not cover is its own path gate. Its `go` filter
# does not match `plugins/*/manifest.json` - no filter there matches it at all,
# so a manifest-only pull request runs no Go job whatsoever - nor
# `plugins/*/themes/`, nor the npm manifests. Yet `plugins.LoadManifests` parses
# every manifest and stats the theme CSS it declares, and two tests read the
# real `plugins/` tree rather than a fixture.
#
# So the Go suite runs here only when the merge touched one of those paths, or
# when nothing stood behind the push at all: a direct push to `main`, a tag, or
# a manual dispatch. Everything else in a merge was already run, against this
# exact tree, by the pull request that produced it.
#
# The trade this accepts: a pull request whose last run predates a sibling merge
# is green against an older `main`, and that stale result is now trusted.
# Requiring branches to be up to date before merging, or a merge queue, is what
# closes that properly - re-running the suite on every merge only narrowed it.
#
# `release` does the expensive packaging (Android APK, Docker image, GHCR push,
# artifacts, godoc) and runs only for `v*` tags, plus manual dispatch. Nothing
# in this repository consumes a per-merge `latest` image: the README points
# self-hosters at the upstream image, and deployments build the `Dockerfile`
# from source. Publishing on every merge produced an image nobody pulled.
#
# `deploy` tells Hostim to rebuild the hosted instance, and runs only after
# `verify` and only for `main`. It is a request plus a wait: the build itself
# happens on Hostim, from this repository's `Dockerfile`, and the job fails if
# the app does not come up. Its three credentials are all secrets, so the job
# cannot be gated on them — a job `if` reads `vars` and not `secrets` — and it
# starts on every `main` push instead, reporting in its first step which of the
# three states it is in: none set is a fork and exits green, all three set
# rebuilds, and some-but-not-all is a misconfiguration and fails naming what is
# absent. Running a job that may have nothing to do buys the guarantee that
# every merge leaves a readable answer to "did this deploy?" behind.
#
# Pull requests are verified by `pr.yml`, which is gated on changed paths.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel. Tag builds must always finish, and a `main` run is not only a
  # build once `deploy` is configured: cancelling it stops the job's wait and
  # nothing else — the rebuild it already asked Hostim for keeps running, goes
  # live unwatched, and the successor's rebuild lands on top of a build in
  # flight. Runs on `main` therefore queue. GitHub keeps at most one run pending
  # per group, so a burst of merges still collapses to "the one in flight, then
  # the newest", which is what cancelling was for.
  #
  # This used to hold only where the Hostim credentials were absent, so a fork
  # kept cancelling its superseded `main` builds. That condition read `vars`, and
  # the credentials are secrets now (see `deploy`); `concurrency` cannot read
  # `secrets` any more than a job `if` can, so the distinction is gone. A fork
  # pays for it by queueing `main` runs it would rather have cancelled — a job
  # that exits in seconds when nothing is configured, against the alternative of
  # abandoning a rollout mid-flight here.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Merge Commit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # The whole Go suite runs against this server: every test gets its own
      # database, cloned from a template the run builds once. The tests fail
      # rather than skip when this DSN is set, so a broken service cannot
      # report a green suite that verified nothing.
      #
      # The role must be able to CREATE DATABASE, which the postgres image's
      # POSTGRES_USER is. Pointing this at a managed database does not work and
      # is not meant to.
      #
      # This block is duplicated in the other workflow on purpose: GitHub Actions has no
      # YAML anchors, and the two workflows must gate against the same server
      # version and credentials. Change both together.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rolltop
          POSTGRES_PASSWORD: rolltop
          POSTGRES_DB: rolltop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rolltop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check Out
        uses: actions/checkout@v5
        with:
          # The classification below diffs this push against the commit it
          # replaced, so a shallow tip is not enough history.
          fetch-depth: 0

      # Decides whether the Go suite has to run at all. Every branch that cannot
      # prove a pull request already ran it answers `true`: this is a merge gate,
      # so it fails towards running the suite.
      - name: Classify Push
        id: classify
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          run_suite() {
            echo "Go suite: running - $1"
            echo "go_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [ "$EVENT" = "push" ] || run_suite "not a push event"
          [ "$REF_TYPE" = "branch" ] || run_suite "tag build"

          case "$BEFORE" in
            "" | 0000000000000000000000000000000000000000)
              run_suite "no previous commit to diff against" ;;
          esac
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || run_suite "previous commit ${BEFORE} is unreachable"

          # A reviewed merge has two parents. One parent means someone pushed
          # straight to `main`, and then no pull request ran anything.
          if [ "$(git rev-list --parents -n 1 "$AFTER" | wc -w)" -ne 3 ]; then
            run_suite "push is not a two-parent merge commit"
          fi

          # Kept deliberately in step with the `changes` job in `pr.yml`: every
          # entry is a path its `go` filter misses and the Go suite still reads.
          # Widening that filter instead would put a three-minute Go job on every
          # theme-only pull request, which is the cost this avoids.
          uncovered='^plugins/[^/]+/manifest\.json$|^plugins/[^/]+/themes/|^package(-lock)?\.json$|^\.github/workflows/'
          if hits="$(git diff --name-only "$BEFORE" "$AFTER" | grep -E "$uncovered")"; then
            run_suite "$(tr '\n' ' ' <<< "$hits")"
          fi

          echo "Go suite: skipped - the pull request ran it against this tree"
          echo "go_suite=false" >> "$GITHUB_OUTPUT"

      - name: Prepare Artifact Directories
      # -p 2 bounds how many package binaries run at once. The suite does real
      # database I/O in every test now, and the default (one per core) makes a
      # 4-core runner oversubscribe itself badly enough that timing-sensitive
      # tests miss deadlines they normally clear in under a second. This is a
      # scheduling limit, not a flake workaround: the same run is green at 2 and
      # red at 4, reproducibly.
        run: |
          mkdir -p test-results
          echo "Rolltop CI test artifacts" > test-results/manifest.txt

      - name: Set Up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      # Node exists here only to compile the themes the Go suite stats and to
      # render its report, so it follows the same condition.
      - name: Set Up Node
        if: steps.classify.outputs.go_suite == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `plugins.LoadManifests` stats the theme CSS a manifest declares, so the
      # Go suite needs the compiled themes. Build only those, not the full
      # frontend bundle: `release` and the `Dockerfile` build that from source.
      - name: Build Theme Assets
        if: steps.classify.outputs.go_suite == 'true'
        run: |
          npm ci
          npm run build:themes

      # Deliberately no `-coverprofile`. Several tests compile a real backend
      # plugin with `go build -buildmode=plugin` and load it via `plugin.Open`,
      # which requires host and plugin to agree on the build fingerprint of
      # every shared package. Coverage over `./...` instruments
      # `plugins/client_side_pgp/schema` inside the test binary but not inside
      # the plugin the test builds, so every such test failed with "plugin was
      # built with a different version of package
      # rolltop/plugins/client_side_pgp/schema". That broke 14 tests across
      # backend/web and backend/syncer on every merge, which is why `main` was
      # red while pull requests were green: `pr.yml` never asked for coverage.
      # A merge gate that cannot run the suite is worth less than a coverage
      # number nothing read.
      #
      # `-p 2` bounds how many package binaries run at once. Every test does
      # real database I/O now, and the default — one per core — oversubscribes
      # a 4-vCPU runner badly enough that timing-sensitive tests miss deadlines
      # they normally clear in under a second. A scheduling limit, not a flake
      # workaround: the same run is green at 2 and red at 4, reproducibly.
      - name: Run Go Tests
        if: steps.classify.outputs.go_suite == 'true'
        env:
          TEST_DATABASE_URL: postgres://rolltop:rolltop@localhost:5432/rolltop_test?sslmode=disable
        run: |
          mkdir -p test-results
          set +e
          go test -p 2 -json ./... 2>&1 | tee test-results/go-test.json
          status=${PIPESTATUS[0]}
          set -e

          node .github/scripts/go-test-report.mjs test-results/go-test.json test-results
          cat test-results/go-test-report.md >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # `go test` compiles every package, but not with `-buildmode=plugin`, and
      # deployments link these shared objects while building the `Dockerfile`.
      # A link failure has to surface here, not on the deployment host.
      - name: Link Plugin Backends
        run: |
          set -euo pipefail
          for backend in plugins/*/backend; do
            plugin="$(basename "$(dirname "$backend")")"
            CGO_ENABLED=1 GOOS=linux go build -buildmode=plugin -o "/tmp/${plugin}.so" "./${backend}"
          done

      - name: Verify Checked-In Spam Model
        run: |
          go run ./plugins/experimental_spam_filter/training/cmd/spamtrain verify \
            --model plugins/experimental_spam_filter/model/model.bin \
            --metadata plugins/experimental_spam_filter/model/model.json \
            --report plugins/experimental_spam_filter/model/benchmark.json

      - name: Ensure Test Results Artifact Exists
        if: always()
      # -p 2 bounds how many package binaries run at once. The suite does real
      # database I/O in every test now, and the default (one per core) makes a
      # 4-core runner oversubscribe itself badly enough that timing-sensitive
      # tests miss deadlines they normally clear in under a second. This is a
      # scheduling limit, not a flake workaround: the same run is green at 2 and
      # red at 4, reproducibly.
        run: |
          mkdir -p test-results
          if [ ! -e test-results/manifest.txt ]; then
            echo "Rolltop CI test artifacts" > test-results/manifest.txt
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ github.ref_name }}
          path: test-results
          if-no-files-found: error

  release:
    name: Package And Publish
    needs: verify
    # Tags publish a version; manual dispatch republishes `latest` on demand.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check Out
        uses: actions/checkout@v5

      - name: Set Build Metadata
        id: build-meta
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="latest"
          fi
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rolltop"
          binary="rolltop-${version}-linux-amd64"
          {
            echo "ROLLTOP_VERSION=$version"
            echo "ROLLTOP_BUILD_DATE=$build_date"
            echo "ROLLTOP_IMAGE=$image"
            echo "ROLLTOP_BINARY=$binary"
          } >> "$GITHUB_ENV"
          {
            echo "version=$version"
            echo "build_date=$build_date"
            echo "image=$image"
            echo "binary=$binary"
            echo "docker_tags=${image}:${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Artifact Directories
        run: |
          mkdir -p test-results build-artifacts
          echo "Rolltop CI packaging artifacts" > test-results/manifest.txt

      - name: Set Up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set Up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Up Gradle
        # No `gradle-version:` here on purpose: the build runs through the
        # project's Gradle wrapper (`./android/gradlew`), which pins its own
        # version, so pinning one on the action only installs a standalone
        # Gradle the build never invokes. The action is kept for its
        # dependency caching.
        uses: gradle/actions/setup-gradle@v5

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript Checks
      # -p 2 bounds how many package binaries run at once. The suite does real
      # database I/O in every test now, and the default (one per core) makes a
      # 4-core runner oversubscribe itself badly enough that timing-sensitive
      # tests miss deadlines they normally clear in under a second. This is a
      # scheduling limit, not a flake workaround: the same run is green at 2 and
      # red at 4, reproducibly.
        run: |
          mkdir -p test-results
          start=$(date +%s)
          set +e
          npm run typecheck 2>&1 | tee test-results/typescript-typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          elapsed=$(($(date +%s) - start))

          node .github/scripts/typescript-test-report.mjs "$status" "$elapsed" test-results/typescript-typecheck.log test-results
          cat test-results/typescript-test-report.md >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Run Frontend Tests
        run: npm run test

      - name: Build Frontend
        run: |
          mkdir -p test-results build-artifacts
          set +e
          npm run build:vite 2>&1 | tee test-results/frontend-build.log
          frontend_status=${PIPESTATUS[0]}
          npm run build:plugins 2>&1 | tee test-results/plugin-frontend-build.log
          plugin_status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Frontend Build"
            echo
            if [ "$frontend_status" -eq 0 ] && [ "$plugin_status" -eq 0 ]; then
              echo "Status: pass"
            else
              echo "Status: fail"
            fi
            echo
            echo "Build log: \`test-results/frontend-build.log\`"
            echo "Plugin build log: \`test-results/plugin-frontend-build.log\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$frontend_status" -ne 0 ]; then
            exit "$frontend_status"
          fi
          exit "$plugin_status"

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist-${{ steps.build-meta.outputs.version }}
          path: frontend/dist
          if-no-files-found: error

      # Writes the signed APK and its update feed into `frontend/public/android`,
      # which the Docker frontend stage copies into the image. This step must
      # stay ahead of the Docker build.
      - name: Build Android App
        id: android-build
        env:
          ROLLTOP_ANDROID_KEYSTORE_BASE64: ${{ secrets.ROLLTOP_ANDROID_KEYSTORE_BASE64 }}
          ROLLTOP_ANDROID_STORE_PASSWORD: ${{ secrets.ROLLTOP_ANDROID_STORE_PASSWORD }}
          ROLLTOP_ANDROID_KEY_ALIAS: ${{ secrets.ROLLTOP_ANDROID_KEY_ALIAS }}
          ROLLTOP_ANDROID_KEY_PASSWORD: ${{ secrets.ROLLTOP_ANDROID_KEY_PASSWORD }}
          ROLLTOP_ANDROID_CERT_SHA256: ${{ secrets.ROLLTOP_ANDROID_CERT_SHA256 }}
        run: |
          mkdir -p build-artifacts/android
          rm -rf frontend/public/android

          export ROLLTOP_ANDROID_VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export ROLLTOP_ANDROID_VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            export ROLLTOP_ANDROID_VERSION_NAME="0.2.${GITHUB_RUN_NUMBER}"
          fi

          signing_values=0
          for value in \
            "$ROLLTOP_ANDROID_KEYSTORE_BASE64" \
            "$ROLLTOP_ANDROID_STORE_PASSWORD" \
            "$ROLLTOP_ANDROID_KEY_ALIAS" \
            "$ROLLTOP_ANDROID_KEY_PASSWORD" \
            "$ROLLTOP_ANDROID_CERT_SHA256"; do
            if [ -n "$value" ]; then signing_values=$((signing_values + 1)); fi
          done
          if [ "$signing_values" -ne 0 ] && [ "$signing_values" -ne 5 ]; then
            echo "Android release signing is only partially configured." >&2
            exit 1
          fi

          if [ "$signing_values" -eq 5 ]; then
            export ROLLTOP_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/rolltop-release.jks"
            printf '%s' "$ROLLTOP_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ROLLTOP_ANDROID_KEYSTORE_FILE"
          fi

          ./android/gradlew -p android :app:testDebugUnitTest :app:lintDebug

          if [ "$signing_values" -eq 5 ]; then
            ./android/gradlew -p android :app:assembleRelease
            apk_path="android/app/build/outputs/apk/release/app-release.apk"
            metadata_path="android/app/build/outputs/apk/release/output-metadata.json"
            artifact_suffix="release"
            echo "server_update=true" >> "$GITHUB_OUTPUT"
          else
            # A debug-signed APK cannot update a release install, so a tagged
            # release must not ship one.
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "Tagged builds require the five ROLLTOP_ANDROID_* signing secrets." >&2
              exit 1
            fi
            ./android/gradlew -p android :app:assembleDebug
            apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
            metadata_path="android/app/build/outputs/apk/debug/output-metadata.json"
            artifact_suffix="debug"
            echo "server_update=false" >> "$GITHUB_OUTPUT"
          fi

          apksigner_path="$(find "${ANDROID_HOME:?}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "Could not locate Android apksigner." >&2
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs "$apk_path" | tee build-artifacts/android/apksigner-verification.txt
          if [ "$signing_values" -eq 5 ]; then
            expected_cert="$(printf '%s' "$ROLLTOP_ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
            actual_cert="$(awk -F ': ' '/certificate SHA-256 digest:/ { print $NF; exit }' build-artifacts/android/apksigner-verification.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
            if [[ ! "$expected_cert" =~ ^[0-9a-f]{64}$ ]] || [ "$actual_cert" != "$expected_cert" ]; then
              echo "Android APK signer does not match ROLLTOP_ANDROID_CERT_SHA256." >&2
              exit 1
            fi
          fi

          cp "$apk_path" "build-artifacts/android/rolltop-android-${ROLLTOP_VERSION}-${artifact_suffix}.apk"
          version_code="$(jq -r '.elements[0].versionCode' "$metadata_path")"
          version_name="$(jq -r '.elements[0].versionName' "$metadata_path")"
          if [ "$signing_values" -eq 5 ]; then
            mkdir -p frontend/public/android
            cp "$apk_path" frontend/public/android/rolltop.apk
            apk_sha256="$(sha256sum frontend/public/android/rolltop.apk | awk '{print $1}')"
            jq -n \
              --argjson versionCode "$version_code" \
              --arg versionName "$version_name" \
              --arg apkUrl "/android/rolltop.apk" \
              --arg sha256 "$apk_sha256" \
              '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256}' \
              > frontend/public/android/latest.json
            test "$(jq -r '.versionCode' frontend/public/android/latest.json)" = "$version_code"
            test "$(jq -r '.sha256' frontend/public/android/latest.json)" = "$(sha256sum frontend/public/android/rolltop.apk | awk '{print $1}')"
          fi

          {
            echo "### Android Build"
            echo
            echo "Version: \`${version_name} (${version_code})\`"
            echo "Variant: \`${artifact_suffix}\`"
            if [ "$signing_values" -eq 5 ]; then
              echo "Server self-update: published"
            else
              echo "Server self-update: not published; configure release-signing secrets"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android App
        uses: actions/upload-artifact@v5
        with:
          name: rolltop-android-${{ steps.build-meta.outputs.version }}
          path: build-artifacts/android/*.apk
          if-no-files-found: error

      # Derived from the directories on disk, not a hand-maintained list, so a
      # new plugin backend cannot be silently left out of the artifact.
      - name: Build Plugin Backends
        run: |
          set -euo pipefail
          mkdir -p build-artifacts/plugins
          for backend in plugins/*/backend; do
            plugin="$(basename "$(dirname "$backend")")"
            mkdir -p "build-artifacts/plugins/${plugin}/backend"
            CGO_ENABLED=1 GOOS=linux go build -buildmode=plugin -trimpath -ldflags="-s -w" -o "build-artifacts/plugins/${plugin}/backend/${plugin}.so" "./${backend}"
          done

      - name: Upload Plugin Backends
        uses: actions/upload-artifact@v5
        with:
          name: plugin-backends-${{ steps.build-meta.outputs.version }}
          path: build-artifacts/plugins
          if-no-files-found: error

      - name: Generate Go Documentation
        run: |
          mkdir -p godoc
          go list ./... > godoc/packages.txt
          while IFS= read -r pkg; do
            rel="${pkg#rolltop/}"
            out="godoc/${rel}.txt"
            mkdir -p "$(dirname "$out")"
            go doc -all "$pkg" > "$out"
          done < godoc/packages.txt
          package_count=$(wc -l < godoc/packages.txt | tr -d " ")
          {
            echo "### Go Documentation"
            echo
            echo "Packages: ${package_count}"
            echo "Artifact: \`godoc-${ROLLTOP_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Go Documentation
        uses: actions/upload-artifact@v5
        with:
          name: godoc-${{ steps.build-meta.outputs.version }}
          path: godoc
          if-no-files-found: error

      - name: Build Backend Binary
        run: |
          mkdir -p build-artifacts
          CGO_ENABLED=1 GOOS=linux go build -trimpath -ldflags="-s -w -X rolltop/backend/buildinfo.Version=${ROLLTOP_VERSION} -X rolltop/backend/buildinfo.BuildDate=${ROLLTOP_BUILD_DATE} -X rolltop/backend/buildinfo.Commit=${GITHUB_SHA}" -o "build-artifacts/${ROLLTOP_BINARY}" ./cmd/rolltop

      - name: Upload Backend Binary
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.build-meta.outputs.binary }}
          path: build-artifacts/${{ steps.build-meta.outputs.binary }}
          if-no-files-found: error

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg "ROLLTOP_VERSION=${ROLLTOP_VERSION}" \
            --build-arg "ROLLTOP_BUILD_DATE=${ROLLTOP_BUILD_DATE}" \
            --build-arg "ROLLTOP_COMMIT=${GITHUB_SHA}" \
            --label "org.opencontainers.image.title=rolltop" \
            --label "org.opencontainers.image.url=https://rolltop.app" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=${ROLLTOP_BUILD_DATE}" \
            --label "org.opencontainers.image.version=${ROLLTOP_VERSION}" \
            -t "${ROLLTOP_IMAGE}:${ROLLTOP_VERSION}" \
            .

      - name: Verify Docker Android Update Feed
        if: steps.android-build.outputs.server_update == 'true'
        run: |
          container_id="$(docker create "${ROLLTOP_IMAGE}:${ROLLTOP_VERSION}")"
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/rolltop-image-android"
          docker cp "$container_id:/app/frontend/dist/android/latest.json" "$RUNNER_TEMP/rolltop-image-android/latest.json"
          docker cp "$container_id:/app/frontend/dist/android/rolltop.apk" "$RUNNER_TEMP/rolltop-image-android/rolltop.apk"

          cmp frontend/public/android/latest.json "$RUNNER_TEMP/rolltop-image-android/latest.json"
          cmp frontend/public/android/rolltop.apk "$RUNNER_TEMP/rolltop-image-android/rolltop.apk"
          expected_sha="$(jq -r '.sha256' "$RUNNER_TEMP/rolltop-image-android/latest.json")"
          actual_sha="$(sha256sum "$RUNNER_TEMP/rolltop-image-android/rolltop.apk" | awk '{print $1}')"
          test "$expected_sha" = "$actual_sha"

          metadata_version="$(jq -r '.versionCode' "$RUNNER_TEMP/rolltop-image-android/latest.json")"
          apk_version="$("${ANDROID_HOME:?}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)/aapt" dump badging "$RUNNER_TEMP/rolltop-image-android/rolltop.apk" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$metadata_version" = "$apk_version"

      - name: Log In To GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish Docker Image
        run: |
          docker push "${ROLLTOP_IMAGE}:${ROLLTOP_VERSION}"

      - name: Docker Image Summary
        run: |
          {
            echo "### Docker Image"
            echo
            echo "Image: \`${ROLLTOP_IMAGE}:${ROLLTOP_VERSION}\`"
            echo "Published: yes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Packaging Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: packaging-results-${{ steps.build-meta.outputs.version }}
          path: test-results
          if-no-files-found: ignore

  deploy:
    name: Deploy To Hostim
    needs: verify
    # `needs: verify` is the whole point of putting this in `ci.yml` rather than
    # in a workflow of its own: no deploy is started behind a red post-merge gate.
    # It is not a promise that only verified code runs — a Hostim rebuild takes no
    # ref, so what gets built is the tip of `main` at the moment Hostim checks it
    # out, which a merge landing during the run has already moved. That gap closes
    # only with an `image:` deploy of a per-commit tag, which would mean publishing
    # an image per merge; `verify` skipping the Go suite is not a red result, and
    # this is not the mechanism that decides which commit serves.
    #
    # Restricted to `main` for the same reason: dispatching this workflow from a
    # tag would deploy `main`'s tip under a tag's name. A tag build runs `release`
    # and nothing else. Tagged images go to GHCR for self-hosters; the hosted
    # instance follows `main`.
    #
    # The branch is the whole condition, and that is the deliberate part. All
    # three credentials are secrets, and a job `if` cannot read `secrets` — so
    # whether this repository deploys at all is decided by the first step below,
    # not here. The job therefore starts on every `main` push and costs a runner
    # for a few seconds where nothing is configured. That is the price of the
    # failure mode it buys out: gating the job on a value the condition could
    # read meant a repository whose credentials were not where the condition
    # looked skipped the job entirely, and a skipped job leaves nothing behind —
    # no log, no summary, a green tick on a merge that never deployed. It went
    # unnoticed across three merges. A job that always runs and reports what it
    # found cannot fail that way.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The action waits out a Kaniko build of this repository's `Dockerfile`,
    # which is the slow kind: ~324 MB of plugin shared objects, and nothing is
    # cached unless the builder was told to cache. `timeout` below bounds the
    # wait itself; this bounds the job around it.
    timeout-minutes: 35
    # Nothing here touches the repository — no checkout, no package push. The
    # runner still fetches the action itself with an empty token.
    permissions: {}

    # No job-level `concurrency`: it would add a second group without protecting
    # anything, since cancelling a run cancels its jobs whatever group they are
    # in. Serialisation lives in the workflow-level block at the top of this file.

    steps:
      # Three states, and the difference between them is the point of this step.
      #
      # Nothing set anywhere is a fork: it reports that and exits green, so a
      # fork inherits a working pipeline rather than a failure it cannot fix.
      #
      # All three set is a deploying repository and the rebuild goes ahead.
      #
      # Some but not all is a misconfiguration, and it fails loudly naming what
      # is absent. This is the case that has to be loud: a half-configured
      # repository going quietly green while its deploys stop is the failure
      # this whole step exists to prevent.
      #
      # `vars` of the same names are read here only to diagnose the fourth
      # possibility — credentials set, but under the Variables tab instead of
      # Secrets. That is not a hypothetical: it is what happened, and from the
      # outside it is indistinguishable from a fork. Naming it costs three
      # `env` lines and turns a silent skip into an error that says where to
      # look. Keep it even if the tabs are never confused again.
      - name: Check Deploy Configuration
        id: config
        env:
          HOSTIM_API_TOKEN: ${{ secrets.HOSTIM_API_TOKEN }}
          HOSTIM_PROJECT: ${{ secrets.HOSTIM_PROJECT }}
          HOSTIM_APP: ${{ secrets.HOSTIM_APP }}
          HOSTIM_API_TOKEN_VAR: ${{ vars.HOSTIM_API_TOKEN }}
          HOSTIM_PROJECT_VAR: ${{ vars.HOSTIM_PROJECT }}
          HOSTIM_APP_VAR: ${{ vars.HOSTIM_APP }}
        run: |
          present=""
          missing=""
          misplaced=""

          # $1 name, $2 value as a secret, $3 value as a repository variable.
          classify() {
            if [ -n "$2" ]; then
              present="$present $1"
            else
              missing="$missing $1"
              if [ -n "$3" ]; then
                misplaced="$misplaced $1"
              fi
            fi
          }

          classify HOSTIM_API_TOKEN "$HOSTIM_API_TOKEN" "$HOSTIM_API_TOKEN_VAR"
          classify HOSTIM_PROJECT "$HOSTIM_PROJECT" "$HOSTIM_PROJECT_VAR"
          classify HOSTIM_APP "$HOSTIM_APP" "$HOSTIM_APP_VAR"

          # Nothing under either tab: a fork, and not an error.
          if [ -z "$present" ] && [ -z "$misplaced" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No Hostim credentials are set in this repository."
            echo "Nothing was sent to Hostim, and that is not a failure here:"
            echo "a repository without credentials is not expected to deploy."
            exit 0
          fi

          if [ -n "$missing" ]; then
            echo "This repository is configured to deploy to Hostim but is missing:${missing}." >&2
            if [ -n "$misplaced" ]; then
              echo >&2
              echo "Set as repository variables rather than secrets:${misplaced}." >&2
              echo "This workflow reads all three from secrets. Create them under" >&2
              echo "the Secrets tab, then delete the variables of the same names." >&2
            fi
            echo >&2
            echo "Set them under Settings -> Secrets and variables -> Actions -> Secrets." >&2
            echo "To stop deploying from this repository, clear all three together." >&2
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "All three Hostim credentials are present; requesting a rebuild."

      # `action: rebuild` because the hosted app is a Git deployment: Hostim
      # builds the `Dockerfile` from source itself. It is deliberately not an
      # `image:` deploy — `release` publishes to GHCR only for `v*` tags, so
      # there is no per-merge image for this job to point at.
      #
      # `wait: true` is the action's default and is spelled out because the
      # failure signal depends on it: without it the job goes green the moment
      # Hostim accepts the request, and a build that fails or an app that never
      # becomes healthy would be reported here as a successful deployment.
      - name: Rebuild App
        id: deploy
        if: steps.config.outputs.configured == 'true'
        uses: hostimdev/action@v2
        with:
          api_token: ${{ secrets.HOSTIM_API_TOKEN }}
          project: ${{ secrets.HOSTIM_PROJECT }}
          app: ${{ secrets.HOSTIM_APP }}
          action: rebuild
          wait: true
          timeout: 1800

      # Deliberately names no app and no project. Both are secrets now, and a
      # secret echoed into a summary is either redacted to `***` or, worse, is
      # not — so the summary says what happened and leaves identifying the
      # target to whoever holds the credentials.
      - name: Deployment Summary
        if: always()
        env:
          CONFIGURED: ${{ steps.config.outputs.configured }}
          OUTCOME: ${{ steps.deploy.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Hostim Deployment"
            echo
            case "$CONFIGURED" in
              false)
                echo "Status: no Hostim credentials are set here; nothing was sent"
                ;;
              true)
                # Deliberately "requested for", not "deployed": the rebuild carries no
                # ref, so Hostim builds whatever `main` points at when it checks out.
                # That is this commit unless another merge landed in between.
                echo "Requested for: \`${GITHUB_SHA}\` (Hostim builds the tip of \`main\` at checkout time)"
                echo
                case "$OUTCOME" in
                  success)   echo "Status: live" ;;
                  cancelled) echo "Status: the wait was cancelled; the Hostim build it asked for is still running" ;;
                  failure)   echo "Status: failed — the app was not confirmed live" ;;
                  *)         echo "Status: ${OUTCOME} — the app was not confirmed live" ;;
                esac
                ;;
              *)
                if [ "$JOB_STATUS" = "cancelled" ]; then
                  echo "Status: not attempted; the run was cancelled before the configuration was checked"
                else
                  echo "Status: not attempted; the configuration check above failed"
                fi
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
